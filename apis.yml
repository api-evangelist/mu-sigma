aid: mu-sigma
name: Mu Sigma
description: >-
  Mu Sigma is a decision sciences and AI services company founded in 2004, headquartered in
  Northbrook, Illinois with its principal delivery centre in Bangalore, India, working with 140+
  Fortune 500 clients across retail, pharma, financial services, manufacturing, energy, technology
  and logistics. Its work is delivered as engagements and platforms rather than as a public
  developer product: the Art of Problem Solving System (muAoPS), the Akashic Architecture
  enterprise intelligence foundation, the muTalos agentic-AI ecosystem, Enablers of Confidence, and
  a Continuous Service-as-a-Software operating model. Mu Sigma publishes no developer portal, no API
  reference and no machine-readable API contract; its only public machine-readable engineering
  output is a set of open-source R packages for decision science (HVT, muHVT, analysisPipelines,
  RImpala, Rdrools) released to CRAN from the github.com/Mu-Sigma organization.
